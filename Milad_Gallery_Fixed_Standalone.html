<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>گالری عینک میلاد | کارت ویزیت دیجیتال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  color-scheme:dark;box-sizing:border-box;
  --bg:#090b0e;--bg2:#17191d;--line:rgba(237,191,66,.27);--text:#fff9e9;--muted:#c7bda8;
  --accent:#f5cc58;--accent2:#b78624;--accent3:#ffe9a0;--glow:rgba(219,167,42,.23);
  --hot:#fff2b5;--hot2:#f3c54a;--hot3:#9d6816;--hot-glow:rgba(245,192,60,.48);
  
}
:root[data-theme="light"]{color-scheme:light;--bg:#f9f6ed;--bg2:#fffdf7;--line:rgba(144,102,27,.26);--text:#211b12;--muted:#66583f;--accent:#9c6a12;--accent2:#c4942e;--accent3:#76500f;--glow:rgba(202,153,42,.18);--hot:#a36b13;--hot2:#cf9b2d;--hot3:#80500e;--hot-glow:rgba(202,153,42,.3)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;display:flex;justify-content:center;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--bg);color:var(--text);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  background-image:radial-gradient(ellipse at 12% 12%,rgba(186,144,54,.15),transparent 48%),radial-gradient(ellipse at 90% 90%,var(--glow),transparent 50%);
  background-attachment:fixed;
}
.card{
  width:100%;max-width:470px;padding:38px 22px 26px;text-align:center;
  border:1px solid var(--line);border-radius:30px;
  background:linear-gradient(145deg,rgba(220,174,66,.11),rgba(255,255,255,.025) 45%,rgba(210,155,38,.055));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 80px -30px var(--glow),inset 0 1px 0 var(--line);
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.avatar{
  position:relative;width:150px;height:150px;margin:0 auto 20px;padding:3px;border-radius:50%;
  background:conic-gradient(from 200deg,#fff1b0,#a36d18,#f6d86e,#fff1b0);
  animation:halo 6s ease-in-out infinite;
}
@keyframes halo{0%,100%{box-shadow:0 0 36px -8px var(--glow)}50%{box-shadow:0 0 54px -4px var(--glow)}}
.avatar .in{
  width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:70px;line-height:1;
  background:#fff;overflow:hidden;
}
.avatar .in span{filter:drop-shadow(0 6px 10px var(--glow))}
.avatar .in img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.01em;color:var(--accent3)}
.brand-en{margin:2px 0 0;font:600 15px "Cormorant Garamond",serif;letter-spacing:.34em;color:var(--accent);direction:ltr}
.quote{margin:19px 0 26px;padding:19px 16px;border-radius:18px;font-size:13.5px;line-height:2.2;color:var(--muted);border:1px solid var(--line);background:linear-gradient(160deg,rgba(213,167,59,.10),rgba(213,167,59,.015));box-shadow:inset 0 1px 0 var(--line)}
.quote strong{display:block;color:var(--accent3);font-size:16px;font-weight:700}
.rows{display:grid;gap:10px}
.row{
  position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:18px;color:var(--text);text-decoration:none;
  border:1px solid var(--line);background:rgba(255,255,255,.025);transition:border-color .25s,transform .25s,box-shadow .25s;
}
.row::before,.tool::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(150px circle at var(--x,50%) var(--y,50%),var(--glow),transparent 70%)}
.row:hover,.tool:hover{border-color:var(--accent);box-shadow:0 8px 28px -18px var(--glow)}
.row:hover::before,.tool:hover::before{opacity:1}
.row:active{transform:scale(.985)}
.ico{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;border:1px solid var(--line);color:var(--accent3)}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;text-align:right}
.txt b{display:block;font-weight:600;font-size:14.5px;letter-spacing:.005em}

/* OMEGA: signature gold */
.omega{
  margin-top:14px;padding:24px 20px;gap:16px;border:0;border-radius:22px;
  background:linear-gradient(125deg,rgba(248,211,101,.23),rgba(116,76,14,.09) 55%,rgba(255,237,162,.17));
  box-shadow:0 0 34px -12px var(--hot-glow);
}
.omega::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0deg,var(--hot3) 70deg,var(--hot) 140deg,#fff 170deg,var(--hot2) 210deg,transparent 290deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:spin 4s linear infinite;
}
@keyframes spin{to{--a:360deg}}
.omega::before{background:radial-gradient(170px circle at var(--x,50%) var(--y,50%),var(--hot-glow),transparent 70%)}
.omega:hover::before{opacity:1}
.shine{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;border-radius:inherit}
.shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,240,182,.4),transparent);transform:skewX(-18deg);animation:sweep 3.8s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
.omega .ico{width:54px;height:54px;border-radius:16px;border-color:var(--hot2);color:var(--hot);font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;font-weight:600;box-shadow:0 0 18px -4px var(--hot-glow)}
.omega .txt b{
  font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;font-weight:600;letter-spacing:.32em;direction:ltr;text-align:right;
  background:linear-gradient(90deg,var(--hot3),var(--hot),var(--hot2),var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.omega .txt small{display:block;margin-top:4px;font-size:14.5px;color:var(--hot)}
.omega:hover{transform:translateY(-2px)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tool{
  position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:15px 4px 12px;border-radius:18px;direction:ltr;font:inherit;font-size:13px;color:var(--text);cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.025);transition:border-color .25s,transform .25s,box-shadow .25s;
}
.tool:active{transform:scale(.97)}
.tool svg{width:23px;height:23px;color:var(--accent3)}
dialog{padding:24px;border-radius:24px;border:1px solid var(--line);background:var(--bg2);color:var(--text);text-align:center;box-shadow:0 30px 80px -20px var(--glow)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
#qrbox{display:grid;place-items:center;width:224px;height:224px;margin:0 auto 14px;padding:12px;border-radius:16px;background:#fff}
#qrbox img,#qrbox canvas{max-width:100%}
dialog p{margin:0 0 14px;font-size:13px;color:var(--muted)}
dialog button{font:inherit;font-size:14px;padding:9px 28px;border-radius:14px;border:1px solid var(--accent);background:transparent;color:var(--text);cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:480px){body{padding-left:12px;padding-right:12px}.card{padding:30px 18px 24px;border-radius:26px}}
@media (max-width:360px){.card{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){.card,.avatar,.omega::after,.shine::after{animation:none}.row,.tool{transition:none}}
</style>
</head>

    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  });
  var qrDone=false,dlg=document.getElementById('qr');

      }).catch(function(){window.prompt('Copy link:',url);});
    }else{window.prompt('Copy link:',url);}
  });
})();
